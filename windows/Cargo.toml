[package]
name = "isle"
version = "0.2.2"
edition = "2021"
description = "Isle - a living notch for Windows, native Rust (no web engine)"
license = "MIT"

[dependencies]
windows = { version = "0.58", features = [
  "Media_Control",
  "Foundation",
  "Win32_System_Com",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Foundation",
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Networking_WinHttp",
  "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
