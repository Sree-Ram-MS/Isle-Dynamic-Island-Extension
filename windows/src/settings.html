<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isle Settings</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #17171a; color: #f2f2f2;
    display: flex; height: 100vh; overflow: hidden; }
  #side { width: 208px; background: #101013; padding: 20px 12px; flex: none; }
  #side h1 { font-size: 17px; padding: 0 10px 14px; }
  #side button { display: block; width: 100%; text-align: left; font: inherit; color: #c9c9d2;
    background: none; border: none; padding: 9px 10px; border-radius: 9px; cursor: pointer; }
  #side button:hover { background: #222228; }
  #side button.active { background: #ffb454; color: #141416; font-weight: 650; }
  #main { flex: 1; overflow-y: auto; padding: 24px 28px; }
  #main h2 { font-size: 19px; margin-bottom: 6px; }
  .sub { color: #a9a9b3; font-size: 13px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 2px; border-bottom: 1px solid #26262c; }
  .row small { display: block; color: #8a8a94; font-size: 12.5px; margin-top: 2px; }
  .switch { width: 44px; height: 24px; border-radius: 12px; background: #3a3a41; border: none;
    position: relative; flex: none; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #eee; transition: left .15s; }
  .switch.on { background: #ffb454; }
  .switch.on::after { left: 23px; background: #141416; }
  select, input[type="number"] { font: inherit; color: #fff; background: #26262b;
    border: 1px solid #3a3a41; border-radius: 10px; padding: 6px 10px; }
  input[type="number"] { width: 92px; }
  .btn { background: #ffb454; color: #141416; font-weight: 650; border: none;
    border-radius: 999px; padding: 8px 18px; cursor: pointer; font: inherit; }
  .btn.ghost { background: #2a2a30; color: #eee; }
</style>
</head>
<body>
<div id="side">
  <h1>👁 Isle</h1>
  <button data-sec="general" class="active">General</button>
  <button data-sec="music">Music &amp; lyrics</button>
  <button data-sec="pomodoro">Pomodoro</button>
  <button data-sec="water">Water</button>
  <button data-sec="shelf">Shelf</button>
  <button data-sec="about">About</button>
</div>
<div id="main"></div>
<script src="settings.js"></script>
</body>
</html>
