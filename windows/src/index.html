<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="notch">
  <!-- minimal notch: just a thin line at the top edge -->
  <div id="line" hidden></div>

  <!-- collapsed pill: clock / mascot eyes / music / pomodoro / popups -->
  <div id="pill"></div>

  <!-- expanded card -->
  <div id="card" hidden>
    <div id="head">
      <span id="pageTitle">Music</span>
      <span id="headAction"></span>
    </div>
    <div id="pageBody"></div>
    <div id="iconbar"></div>
    <div id="pagebar">
      <div id="dots"></div>
      <button id="gearBtn" title="Settings">⚙</button>
    </div>
  </div>

  <!-- the lyrics split-pill: a second pill under the notch -->
  <div id="lyricsPill" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
