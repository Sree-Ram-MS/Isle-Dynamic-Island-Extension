<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="notch">
  <!-- minimal notch: just a thin line at the top edge -->
  <div id="line" hidden></div>

  <!-- collapsed pill: clock / mascot eyes / music / pomodoro / popups -->
  <div id="pill"></div>

  <!-- expanded card -->
  <div id="card" hidden>
    <div id="strip">
      <span id="stripTitle">Music</span>
      <span id="stripClock"><span id="stripBolt" hidden>⚡</span><span id="stripDate"></span> <b id="stripTime"></b></span>
      <span id="stripAction"></span>
    </div>
    <div id="pageBody"></div>
    <button id="chevL" title="Previous page">‹</button>
    <button id="chevR" title="Next page">›</button>
    <div id="iconbar"></div>
    <div id="pagebar">
      <div id="dots"></div>
      <button id="gearBtn" title="Settings">⚙</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
