<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="notch">
  <!-- minimal notch: just a thin line at the top edge -->
  <div id="line" hidden></div>

  <!-- collapsed pill: clock / mascot eyes / music / pomodoro / popups -->
  <div id="pill"></div>

  <!-- expanded card -->
  <div id="card" hidden>
    <div id="strip">
      <span id="stripTitle"></span>
      <span id="stripClock"><span id="stripBolt" class="bolt sm" hidden><svg viewBox="0 0 24 24"><path d="M13.2 1.6 5 13.4h5.4L9 22.4l8.2-11.8h-5.4l1.4-9z"/></svg></span><span id="stripDate"></span> <b id="stripTime"></b></span>
      <span id="stripRight">
        <span id="stripAction"></span>
        <button id="bellBtn" title="Reminders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 4 1.2 5.4 2 6.5H4c.8-1.1 2-2.5 2-6.5"/><path d="M10.3 19a1.9 1.9 0 0 0 3.4 0"/></svg><span id="bellDot" hidden></span></button>
      </span>
    </div>
    <div id="pageBody"></div>
    <button id="chevL" title="Previous page">‹</button>
    <button id="chevR" title="Next page">›</button>
    <div id="iconbar"></div>
    <div id="pagebar">
      <div id="dots"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
